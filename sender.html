<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launch Home Dashboard</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#0b1220;color:#f7f9fc;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
    .panel{width:min(520px,100%);background:#121c2e;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:26px;box-shadow:0 18px 45px rgba(0,0,0,.25);text-align:center}
    h1{margin:0 0 8px} p{color:#9fb0c9;line-height:1.5}
    .cast-wrap{display:flex;justify-content:center;margin-top:22px}.cast{width:76px;height:76px;--connected-color:#6ea8fe;--disconnected-color:#f7f9fc}
    #status{text-align:center;margin-top:14px;color:#9fb0c9;font-size:14px}
  </style>
  <script>
    const CAST_APP_ID = '03E19645';

    window.__onGCastApiAvailable = function(isAvailable) {
      const status = document.getElementById('status');
      if (!isAvailable) {
        status.textContent = 'Google Cast is not available in this browser.';
        return;
      }
      cast.framework.CastContext.getInstance().setOptions({
        receiverApplicationId: CAST_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });
      status.textContent = 'Ready. Tap the Cast icon and choose your dashboard Chromecast.';
    };
  </script>
</head>
<body>
  <section class="panel">
    <h1>Home Dashboard</h1>
    <p>Launch the always-on household dashboard on your registered Chromecast.</p>
    <div class="cast-wrap"><google-cast-launcher class="cast"></google-cast-launcher></div>
    <div id="status">Loading Google Cast…</div>
  </section>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
