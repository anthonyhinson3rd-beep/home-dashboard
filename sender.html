<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launch Home Dashboard</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#0b1220;color:#f7f9fc;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
    .panel{width:min(560px,100%);background:#121c2e;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:30px;box-shadow:0 18px 45px rgba(0,0,0,.25);text-align:center}
    h1{margin:0 0 8px} p{color:#9fb0c9;line-height:1.5}
    .launch-row{margin:26px auto 10px;display:flex;align-items:center;justify-content:center;gap:16px}
    google-cast-launcher{width:72px;height:72px;--connected-color:#6ea8fe;--disconnected-color:#f7f9fc}
    .label{font-size:18px;font-weight:800}
    #status{margin-top:18px;color:#9fb0c9;font-size:14px;line-height:1.45}
    .small{font-size:12px;color:#71839d;margin-top:12px}
  </style>
  <script>
    const CAST_APP_ID = '03E19645';

    function setStatus(text){
      const el = document.getElementById('status');
      if (el) el.textContent = text;
    }

    window['__onGCastApiAvailable'] = function(isAvailable) {
      if (!isAvailable) {
        setStatus('Google Cast is not available in this browser.');
        return;
      }

      const context = cast.framework.CastContext.getInstance();
      context.setOptions({
        receiverApplicationId: CAST_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });

      context.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, function(event) {
        switch (event.castState) {
          case cast.framework.CastState.NO_DEVICES_AVAILABLE:
            setStatus('No compatible Cast device is currently available for this app.');
            break;
          case cast.framework.CastState.NOT_CONNECTED:
            setStatus('Kitchen TV found. Click the Cast icon above, then choose Kitchen TV.');
            break;
          case cast.framework.CastState.CONNECTING:
            setStatus('Connecting to Kitchen TV…');
            break;
          case cast.framework.CastState.CONNECTED:
            setStatus('Connected. The Home Dashboard receiver is running on the TV.');
            break;
          default:
            setStatus('Cast initialized. Click the Cast icon above.');
        }
      });

      context.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, function(event) {
        if (event.sessionState === cast.framework.SessionState.SESSION_START_FAILED) {
          setStatus('Receiver launch failed: ' + (event.errorCode || 'unknown error'));
        }
      });

      setStatus('Cast initialized. Waiting for Kitchen TV…');
    };
  </script>
</head>
<body>
  <section class="panel">
    <h1>Home Dashboard</h1>
    <p>Launch the custom Home Dashboard receiver directly on the Chromecast.</p>
    <div class="launch-row">
      <google-cast-launcher></google-cast-launcher>
      <div class="label">Click this Cast icon</div>
    </div>
    <div id="status">Loading Google Cast…</div>
    <div class="small">Custom Receiver App ID: 03E19645</div>
  </section>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
