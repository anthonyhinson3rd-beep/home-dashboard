<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home Dashboard Receiver</title>
  <script>
    window.DASHBOARD_BUILD = new URLSearchParams(location.search).get('v') || '2026-08-16-1908';
    document.write('<link rel="stylesheet" href="styles.css?v=' + encodeURIComponent(window.DASHBOARD_BUILD) + '">');
    document.write('<link rel="stylesheet" href="overrides.css?v=' + encodeURIComponent(window.DASHBOARD_BUILD) + '">');
  </script>
</head>
<body>
  <main class="dashboard" aria-label="Home dashboard">
    <header class="topbar card">
      <section class="weather-summary" aria-label="Current weather">
        <div id="weatherIcon" class="weather-icon"></div>
        <div><div id="weatherTemp" class="weather-temp">--°</div><div id="weatherText" class="weather-text">Loading weather…</div></div>
      </section>
      <div class="top-divider"></div>
      <div id="clock" class="clock"></div>
      <div class="top-divider"></div>
      <div class="date-stack"><div id="weekday" class="weekday"></div><div id="date" class="date"></div></div>
      <div id="forecast" class="top-forecast" aria-label="Five day forecast"></div>
    </header>

    <section class="content-grid">
      <section class="card calendar-card">
        <div class="card-header"><h1 id="monthTitle">Month</h1></div>
        <div class="weekday-row"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <aside class="side-column">
        <section class="card agenda-card"><div class="card-header"><h2>Today & Tomorrow</h2></div><div id="agenda" class="agenda"></div></section>
        <section class="card sports-card"><div class="sports-title">Sports</div><div id="sports" class="sports"></div></section>
      </aside>
    </section>

    <footer class="footer"><span id="status">Chromecast receiver online</span><span>Calendar refreshes every minute ↻</span></footer>
  </main>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>document.write('<script src="app.js?v=' + encodeURIComponent(window.DASHBOARD_BUILD) + '"><\/script>');</script>
  <script>document.write('<script src="overrides.js?v=' + encodeURIComponent(window.DASHBOARD_BUILD) + '"><\/script>');</script>
  <script>
    const CONFIG_NAMESPACE = 'urn:x-cast:com.home.dashboard.config';

    async function checkForDashboardUpdate() {
      try {
        const response = await fetch('build-version.txt?_=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) return;
        const latest = (await response.text()).trim();
        if (latest && latest !== window.DASHBOARD_BUILD) {
          const next = new URL(location.href);
          next.searchParams.set('v', latest);
          location.replace(next.toString());
        }
      } catch (_) {}
    }

    window.addEventListener('load', () => {
      try {
        const context = cast.framework.CastReceiverContext.getInstance();
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        options.customNamespaces = {};
        options.customNamespaces[CONFIG_NAMESPACE] = cast.framework.system.MessageType.JSON;
        context.addCustomMessageListener(CONFIG_NAMESPACE, event => {
          try {
            const payload = event.data;
            if (payload && payload.type === 'calendar-config' && payload.key) {
              window.setHomeDashboardCalendarKey(payload.key);
              context.sendCustomMessage(CONFIG_NAMESPACE, event.senderId, { type:'calendar-config-ack', keyReceived:true, keyLength:String(payload.key).length });
            }
          } catch (error) { console.error('Invalid dashboard config message', error); }
        });
        context.start(options);
      } catch (error) { console.error('Cast receiver initialization failed', error); }

      setTimeout(checkForDashboardUpdate, 15000);
      setInterval(checkForDashboardUpdate, 60000);
    });
  </script>
</body>
</html>
