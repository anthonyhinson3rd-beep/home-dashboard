<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home Dashboard Receiver</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="dashboard" aria-label="Home dashboard">
    <header class="topbar">
      <div>
        <div id="date" class="date"></div>
        <div id="clock" class="clock"></div>
      </div>
      <section class="weather-summary" aria-label="Current weather">
        <div id="weatherIcon" class="weather-icon">☀️</div>
        <div>
          <div id="weatherTemp" class="weather-temp">--°</div>
          <div id="weatherText" class="weather-text">Loading weather…</div>
        </div>
      </section>
    </header>

    <section class="content-grid">
      <section class="card calendar-card">
        <div class="card-header">
          <h1 id="monthTitle">Month</h1>
          <div id="locationLabel" class="muted">Blacksburg, VA</div>
        </div>
        <div class="weekday-row">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <aside class="side-column">
        <section class="card agenda-card">
          <div class="card-header"><h2>Upcoming</h2></div>
          <div id="agenda" class="agenda"></div>
        </section>

        <section class="card forecast-card">
          <div class="card-header"><h2>Forecast</h2></div>
          <div id="forecast" class="forecast"></div>
        </section>
      </aside>
    </section>

    <footer class="footer">
      <span id="status">Chromecast receiver online</span>
      <span>Home Dashboard</span>
    </footer>
  </main>

  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="app.js"></script>
  <script>
    window.addEventListener('load', () => {
      try {
        const context = cast.framework.CastReceiverContext.getInstance();
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true;
        context.start(options);
        console.log('Cast receiver started');
      } catch (error) {
        console.error('Cast receiver initialization failed', error);
      }
    });
  </script>
</body>
</html>
